name: Plastic Ox wiki and story notes

on:
  push:
    paths:
      - "plastic_ox/**"
      - ".agents/**"
      - "data/maps/**"
      - "data/scripts/**"
      - "src/data/**"
      - "include/constants/**"
      - ".github/workflows/wiki.yml"
  pull_request:
    paths:
      - "plastic_ox/**"
      - ".agents/**"
      - "data/maps/**"
      - "data/scripts/**"
      - "src/data/**"
      - "include/constants/**"

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static Plastic Ox checks (no ROM build needed)
        run: make -f plastic_ox/pox.mk pox-check-static POX_CI=1
      - name: Build wiki
        run: python3 plastic_ox/wiki/build_wiki.py
      - name: Upload wiki
        uses: actions/upload-artifact@v4
        with:
          name: plastic-ox-wiki
          path: plastic_ox/wiki/site
          retention-days: 30
